<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Kiro — illustration éditoriale « le brise-glace est déjà autour de vous ».
       Deux bulles de conversation qui se recouvrent : la zone commune est ce que
       deux personnes partagent déjà avant d'avoir parlé — le contexte.
       Palette Kiro uniquement (crème, charbon, corail). Aucun texte dans l'image :
       rien d'important n'y est enfermé. Œuvre originale Kiro, aucune licence tierce. -->
  <defs>
    <clipPath id="bulle-gauche">
      <rect x="250" y="185" width="380" height="240" rx="46" ry="46"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#faf6f2"/>

  <!-- Repère montréalais : ligne d'horizon, mont Royal et sa croix, très en retrait -->
  <g fill="none" stroke="#ece4e0" stroke-width="3" stroke-linecap="round">
    <path d="M120 566 H1080"/>
  </g>
  <g fill="#eee5e0">
    <path d="M846 566 C 892 566 916 512 952 500 C 988 512 1012 566 1058 566 Z"/>
  </g>
  <g stroke="#e2d5cf" stroke-width="5" stroke-linecap="round">
    <path d="M952 500 V 464"/>
    <path d="M936 480 H 968"/>
  </g>

  <!-- Zone commune : l'intersection des deux bulles -->
  <g clip-path="url(#bulle-gauche)">
    <rect x="530" y="225" width="380" height="240" rx="46" ry="46" fill="#e0342b" opacity="0.90"/>
  </g>

  <!-- Bulle 1 -->
  <g fill="none" stroke="#171515" stroke-width="7" stroke-linejoin="round">
    <rect x="250" y="185" width="380" height="240" rx="46" ry="46"/>
    <path d="M306 425 V 482 L 358 425"/>
  </g>

  <!-- Bulle 2 -->
  <g fill="none" stroke="#171515" stroke-width="7" stroke-linejoin="round">
    <rect x="530" y="225" width="380" height="240" rx="46" ry="46"/>
    <path d="M854 465 V 522 L 802 465"/>
  </g>

  <!-- Trois points : la conversation qui commence -->
  <g fill="#171515">
    <circle cx="336" cy="305" r="13"/>
    <circle cx="392" cy="305" r="13"/>
    <circle cx="448" cy="305" r="13"/>
  </g>
  <g fill="#171515">
    <circle cx="700" cy="345" r="13"/>
    <circle cx="756" cy="345" r="13"/>
    <circle cx="812" cy="345" r="13"/>
  </g>
</svg>
