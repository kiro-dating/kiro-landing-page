<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
    />
    <link rel="apple-touch-icon" href="/icon_kiro.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070709" />

    <!-- Primary Meta -->
    <!-- Résultat de recherche : src/config/seo.json (rédigé à la main).
         L'aperçu de partage (og:/twitter:) reste généré depuis le hero. -->
    <title>%KIRO_SEO_TITLE%</title>
    <meta name="description" content="%KIRO_SEO_DESCRIPTION%" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph (Facebook, WhatsApp, Discord…)
         Titre, description et image sont INJECTÉS au build depuis
         src/config/og-preview.json, lui-même produit par `npm run og` à partir
         de la copie du hero et des jetons de design. Ne pas les réécrire ici :
         ils redeviendraient faux à la première modification du site.
         La `description` ci-dessus, elle, reste rédigée à la main — c'est
         l'extrait de résultat de recherche, pas l'aperçu de partage. -->
    <meta property="og:site_name" content="Kiro" />
    <meta property="og:title" content="%KIRO_TITLE%" />
    <meta property="og:description" content="%KIRO_OG_DESCRIPTION%" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%%KIRO_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ht_HT" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%KIRO_TITLE%" />
    <meta name="twitter:description" content="%KIRO_OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_SITE_URL%%KIRO_OG_IMAGE%" />

    <!-- Données structurées : mêmes nœuds Organization/WebSite que le blog
         (scripts/blog/seo.mjs), injectés au build — une seule source. -->
    %KIRO_JSON_LD%

    <!-- LCP : le téléphone n'existe que sur grand écran — préchargé seulement là -->
    <link rel="preload" as="image" href="/images/phone-frame.svg" type="image/svg+xml" fetchpriority="high" media="(min-width: 768px)" />
    <link rel="preload" as="image" href="/images/profiles/profile-01.webp" fetchpriority="high" media="(min-width: 768px)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
